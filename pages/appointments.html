<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendez-vous</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>


  <!-- SIDEBAR -->
  <aside class="sidebar">

  <div class="sidebar-logo">
  🏥 Clinique Pédiatrique

  <nav class="sidebar-menu">

  <a href="dashboard.html">📊 Dashboard</a>

  <div class="logout">
  <a href="#">🚪 Déconnexion</a>
  </div>

  </aside>

  <main class="main-content">
  
  <h1>Rendez-vous</h1>
  
  <form id="appointmentForm">
    <input type="text" id="apptChild" placeholder="Nom de l'enfant" required>
    <input type="date" id="apptDate" required>
    <input type="time" id="apptTime" required>
    <select id="apptStatus">
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button type="submit">Ajouter RDV</button>
  </form>

  <table id="appointmentsTable">
    <thead>
      <tr>
        <th>Nom de l'enfant</th>
        <th>Date</th>
        <th>Heure</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>
  <script src="../js/appointments.js"></script>
</body>
</html>
